version: "3.9"

networks:
  ahixo-net:

services:
  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ahixo123
    volumes:
      - mongo_data:/data/db
    networks:
      - ahixo-net

  node-app:
    build: ./server
    restart: always
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: "mongodb://admin:ahixo123@mongo:27017/?authSource=admin"
      PORT: 5001
    depends_on:
      - mongo
    networks:
      - ahixo-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5001/health\",()=>{})'"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongo_data:
