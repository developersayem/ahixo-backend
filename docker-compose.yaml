version: "3.9"

networks:
  ahixo-net:

services:
  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ahixo123
    volumes:
      - mongo_data:/data/db
    networks:
      - ahixo-net

  mongo-express:
    image: mongo-express:1.0.0
    restart: always
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://admin:ahixo123@mongo:27017/?authSource=admin"
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ahixo123
    depends_on:
      - mongo
    networks:
      - ahixo-net
    labels:
      - traefik.enable=true
      # HTTP redirect to HTTPS
      - traefik.http.routers.mongo-express.entrypoints=http
      - traefik.http.routers.mongo-express.middlewares=redirect-to-https
      - traefik.http.routers.mongo-express.rule=Host(`db.ahixo.com`)
      # HTTPS
      - traefik.http.routers.mongo-express-https.entrypoints=https
      - traefik.http.routers.mongo-express-https.rule=Host(`db.ahixo.com`)
      - traefik.http.routers.mongo-express-https.tls.certresolver=letsencrypt

  node-app:
    build: ./server
    restart: always
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: "mongodb://admin:ahixo123@mongo:27017/?authSource=admin"
      PORT: 5001
    depends_on:
      - mongo
    networks:
      - ahixo-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - traefik.enable=true
      # HTTP redirect to HTTPS
      - traefik.http.routers.node-app.entrypoints=http
      - traefik.http.routers.node-app.middlewares=redirect-to-https
      - traefik.http.routers.node-app.rule=Host(`api.ahixo.com`)
      # HTTPS
      - traefik.http.routers.node-app-https.entrypoints=https
      - traefik.http.routers.node-app-https.rule=Host(`api.ahixo.com`)
      - traefik.http.routers.node-app-https.tls.certresolver=letsencrypt

volumes:
  mongo_data:
